function setPhase(n){state.phase=n;save();render()}function toggleWeek(n){state.openWeek=state.openWeek===n?null:n;save();render()}
function diary(){let list=allRuns.filter(r=>state.logs[r.id]?.done).sort((a,b)=>b.date.localeCompare(a.date));return `<h2>Trainingstagebuch</h2><div class="card"><div class="row"><div><div class="muted tiny">GESAMT GELAUFEN</div><div class="big" style="font-size:30px">${kmDone().toFixed(1).replace('.',',')} km</div></div><span class="pill">${list.length} Läufe</span></div></div>${list.length?list.map(r=>{let l=state.logs[r.id];return `<div class="card"><div class="row"><div><div class="day">${iso(r.date)} · Woche ${r.week}</div><strong>${esc(r.description)}</strong><div class="muted tiny">${esc(l.km)} km · ${l.seconds?pace(l.km,l.seconds)+' min/km':'keine Zeit'} · Knie ${l.pain??0}/10</div>${l.note?`<div class="tiny" style="margin-top:8px">${esc(l.note)}</div>`:''}</div><button class="btn small secondary" onclick="edit('${r.id}')">Ändern</button></div></div>`}).join(''):`<div class="empty">Noch kein Lauf eingetragen. Öffne den Wochenplan und dokumentiere deinen ersten Lauf.</div>`}`}
function stats(){let done=allRuns.filter(r=>state.logs[r.id]?.done);let actual=weeks.map(w=>w.runs.reduce((s,r)=>s+(state.logs[r.id]?.done?Number(state.logs[r.id].km)||0:0),0));let p=Math.round(done.length/allRuns.length*100);return `<h2>Dein Fortschritt</h2><div class="grid"><div class="stat"><strong>${kmDone().toFixed(0)}</strong><span>Kilometer</span></div><div class="stat"><strong>${done.length}</strong><span>Läufe</span></div><div class="stat"><strong>${p}%</strong><span>Plan erfüllt</span></div></div><div class="card"><h2>Wochenkilometer</h2><div class="chart">${weeks.map((w,i)=>`<div style="flex:1;display:flex;align-items:end;position:relative;height:100%;background:#1b3529;border-radius:3px 3px 0 0" title="W${w.number}: ${actual[i]} / ${w.km} km"><div class="chartbar" style="height:${w.km/52*100}%;position:absolute;bottom:0;width:100%"></div><div class="chartbar actual" style="height:${Math.min(actual[i]/52*100,100)}%;position:absolute;bottom:0;width:100%;opacity:.95"></div></div>`).join('')}</div><div class="legend tiny muted"><span><i class="dot"></i>Geplant</span><span><i class="dot" style="background:#7cf0ac"></i>Gelaufen</span></div><p class="tiny muted">Woche 1 links, Woche 28 rechts. Tippe im Wochenplan auf die Einheiten, um deine tatsächlichen Kilometer einzutragen.</p></div><div class="card"><h2>Gym-Fortschritt</h2><div class="big" style="font-size:32px">${Object.values(state.gym).filter(x=>x.done).length}</div><div class="muted">abgehakte Gym-Einheiten</div></div><div class="card"><h2>Knie-Check</h2>${done.filter(r=>Number(state.logs[r.id]?.pain)>0).length?`<div class="warning">${done.filter(r=>Number(state.logs[r.id]?.pain)>0).length} Läufe mit gemeldeten Kniebeschwerden. Bitte Trainingsbelastung prüfen.</div>`:'<p class="muted">Bisher keine Kniebeschwerden in deinen Laufprotokollen dokumentiert.</p>'}</div>`}
function settings(){return `<h2>Mehr & Einstellungen</h2><div class="card"><h2>Trainingsgrundlagen</h2><p>🏃 Locker: 5:40–6:20 min/km, nach Gefühl</p><p>🏃 Lange Läufe: 5:20–6:00 min/km</p><p>⚡ Zielpace: 4:15 min/km</p><p class="tiny muted">Die schnellen Trainingspaces gelten erst bei ausreichender Fitness und guter Knieverträglichkeit.</p></div><div class="card"><h2>Deine Gym-Tage</h2><p><strong>Montag:</strong> Unterkörper – Split Squats, Deadlifts, Beinstrecker, Beinbeuger, Wadenheben.</p><p><strong>Mittwoch:</strong> Oberkörper.</p><p><strong>Freitag:</strong> Ganzkörper, Beine moderat vor dem langen Sonntagslauf.</p></div><div class="card"><h2>Datensicherung</h2><p class="tiny muted">Deine Daten bleiben in diesem Browser auf diesem Gerät. Für einen Gerätewechsel oder als Backup kannst du sie exportieren und später wieder importieren.</p><button class="btn" onclick="exportData()">Backup exportieren</button><p><label class="btn secondary" style="display:inline-block">Backup importieren<input type="file" accept="application/json" onchange="importData(event)" style="display:none"></label></p></div><div class="card"><h2>Zum Home-Bildschirm</h2><p class="muted">In Safari: Teilen → Zum Home-Bildschirm. Für eine dauerhafte eigene Internetadresse muss die HTML-Datei zunächst auf einem Webhost veröffentlicht werden.</p></div>`}
function edit(id){let r=allRuns.find(x=>x.id===id),l=state.logs[id]||{};document.getElementById('sheet').innerHTML=`<div class="row"><h2>Training eintragen</h2><button class="btn secondary small" onclick="closeModal()">Schließen ✕</button></div><div class="day">${r.day} · ${iso(r.date)} · Woche ${r.week}</div><h3>${esc(r.description)}</h3><form id="logform" onsubmit="submitLog(event,'${id}')"><div class="fieldgroup"><div><label class="fieldlabel">Gelaufene Kilometer</label><input class="field" name="km" type="number" min="0" max="100" step="0.01" required value="${l.km??r.km}"></div><div><label class="fieldlabel">Zeit (mm:ss oder hh:mm:ss)</label><input class="field" name="time" placeholder="z. B. 32:15" value="${l.seconds?formatTime(l.seconds):''}"></div></div><label class="fieldlabel">Knieschmerzen (0 = keine, 10 = sehr stark)</label><select class="field" name="pain">${Array.from({length:11},(_,i)=>`<option value="${i}" ${Number(l.pain||0)===i?'selected':''}>${i} / 10</option>`).join('')}</select><label class="fieldlabel">Notizen / Gefühl</label><textarea class="field" name="note" rows="3" placeholder="Wie lief es?">${esc(l.note||'')}</textarea><p class="warning">Bei neu auftretenden oder zunehmenden Knieschmerzen den Lauf abbrechen und nicht weiter steigern.</p><button class="btn" style="width:100%;margin-top:15px" type="submit">✓ Lauf speichern</button>${l.done?`<button type="button" class="btn secondary" style="width:100%;margin-top:9px" onclick="removeLog('${id}')">Eintrag löschen</button>`:''}</form>`;document.getElementById('modal').classList.add('show')}
function formatTime(sec){let h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return h?`${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`:`${m}:${String(s).padStart(2,'0')}`}
function submitLog(e,id){e.preventDefault();let f=new FormData(e.target),time=String(f.get('time')).trim(),parts=time?time.split(':').map(Number):[];if(parts.some(x=>!Number.isFinite(x))||parts.length>3||(parts.length===1&&time)){alert('Bitte Zeit als mm:ss oder hh:mm:ss eingeben.');return}let seconds=parts.reduce((a,b)=>a*60+b,0);state.logs[id]={done:true,km:Number(f.get('km')),seconds,pain:Number(f.get('pain')),note:String(f.get('note'))};save();closeModal();render()}
function removeLog(id){delete state.logs[id];save();closeModal();render()}function closeModal(){document.getElementById('modal').classList.remove('show')}
function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='pace90-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}
function importData(e){let f=e.target.files[0];if(!f)return;let rd=new FileReader();rd.onload=()=>{try{let x=JSON.parse(rd.result);if(!x||typeof x!=='object'||typeof x.logs!=='object')throw Error();if(confirm('Aktuelle Daten durch dieses Backup ersetzen?')){state=x;state.gym||={};state.pain||={};state.tab='settings';save();render()}}catch{alert('Ungültige Backup-Datei')}};rd.readAsText(f)}
function render(){nav();let pages={home,plan,log:diary,stats,settings};document.getElementById('app').innerHTML=pages[state.tab]?.()||home();let daysLeft=Math.ceil((new Date('2027-05-09T09:00:00')-new Date())/86400000);document.getElementById('countdown').textContent=daysLeft>0?daysLeft+' Tage bis zum Start':'09.05.2027'}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});render();
</script></body></html>
